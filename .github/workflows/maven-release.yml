name: Maven CI and release

on:
  pull_request:
    branches: [main, master]
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  test:
    name: Test on Java 8
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Run tests
        run: mvn -B clean test

  release:
    name: Release and build on JitPack
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable version tag such as 2.6.1, got: $RELEASE_TAG"
            exit 1
          fi
          version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [[ "$version" != "$RELEASE_TAG" ]]; then
            echo "POM version '$version' does not match tag '$RELEASE_TAG'"
            exit 1
          fi

      - name: Build release artifacts
        run: mvn -B -DskipTests clean package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Trigger and verify JitPack build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          curl --fail --location --retry 3 --retry-delay 10 --max-time 600 \
            "https://jitpack.io/com/github/Aurinko-Yoxel/ews-java-api/${RELEASE_TAG}/ews-java-api-${RELEASE_TAG}.pom" \
            --output /dev/null
